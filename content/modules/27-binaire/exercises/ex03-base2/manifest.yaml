id: ex03-base2
title: "Représentation binaire"
objective: "Construire manuellement la représentation binaire d'un entier avec les quotients et restes des divisions par deux."
difficulty: moyen
estimated_minutes: 35
xp: 70
tags: [csharp,algorithms]
story_beat: "Sécuriser la capacité Représentation binaire d'Asteria."
bonus: true
deliverables: [Base2.cs]
starter: [Base2.cs]
grading:
  - type: io
    cases:
      - stdin: "5\n"
        expect_stdout: "101\n"
        expect_exit: 0
      - stdin: "0\n"
        expect_stdout: "0\n"
        expect_exit: 0
      - stdin: "10\n"
        expect_stdout: "1010\n"
        expect_exit: 0
      # anti-hardcode : 1 => "1" (minimum non nul, pas de zéros en tête)
      - stdin: "1\n"
        expect_stdout: "1\n"
        expect_exit: 0
      # 16 = 2^4 => "10000" (puissance de 2)
      - stdin: "16\n"
        expect_stdout: "10000\n"
        expect_exit: 0
      # 255 = 11111111 (8 bits à 1)
      - stdin: "255\n"
        expect_stdout: "11111111\n"
        expect_exit: 0
      # 42 = 101010 (pattern alternés)
      - stdin: "42\n"
        expect_stdout: "101010\n"
        expect_exit: 0
  - type: source
    source:
      required_fragments: ["% 2"]
      forbidden_fragments: ["Convert.ToString"]
feedback:
  hints:
    - when: io_mismatch
      message: "Traite 0 séparément. Sinon, répète : bit = n % 2, place ce bit à gauche du résultat, puis n = n / 2, jusqu'à n == 0."
    - when: source_constraint
      message: "L'objectif est de pratiquer la conversion : utilise le reste `% 2` et la division entière au lieu de Convert.ToString."
  course_ref: "cours.md#base2"
solution: [Base2.cs]
