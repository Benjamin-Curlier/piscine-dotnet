openapi: 3.1.0
info:
  title: Asteria Commands
  version: 1.0.0
paths:
  /commands:
    post:
      operationId: submitCommand
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandRequest' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandAccepted' }
        '400': { description: Invalid request }
        '409': { description: Conflicting command }
components:
  schemas:
    CommandRequest:
      type: object
      required: [kind, payload]
      properties:
        kind: { type: string }
        payload: { type: string }
    CommandAccepted:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
