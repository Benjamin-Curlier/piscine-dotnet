id: ex01-compteur-static
title: "Compteur d'instances"
objective: "Utiliser un champ statique pour compter le nombre d'instances créées d'une classe."
difficulty: moyen
estimated_minutes: 35
xp: 70
tags: [csharp,immutability]
story_beat: "Sécuriser la capacité Compteur d'instances d'Asteria."
deliverables: [CompteurStatic.cs]
starter: [CompteurStatic.cs]
grading:
  - type: io
    cases:
      - stdin: "3\n"
        expect_stdout: "3\n"
        expect_exit: 0
      - stdin: "1\n"
        expect_stdout: "1\n"
        expect_exit: 0
      - stdin: "5\n"
        expect_stdout: "5\n"
        expect_exit: 0
      # anti-hardcode : 0 instance => Count=0 (cas limite zéro)
      - stdin: "0\n"
        expect_stdout: "0\n"
        expect_exit: 0
      # 10 instances — grand nombre prouve la boucle correcte
      - stdin: "10\n"
        expect_stdout: "10\n"
        expect_exit: 0
  - type: source
    source:
      required_fragments: ["static int"]
feedback:
  hints:
    - when: io_mismatch
      message: "La classe Objet doit avoir `public static int Count;` et incrémenter `Count++` dans son constructeur. Accède à la valeur via `Objet.Count`."
  course_ref: "cours.md#static"
solution: [CompteurStatic.cs]
