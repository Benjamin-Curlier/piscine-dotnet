id: ex02-channel
title: "Producteur / consommateur avec Channel"
objective: "Transférer N entiers d'un producteur à un consommateur via un Channel<int> (FIFO), et afficher leur double."
difficulty: moyen
estimated_minutes: 35
xp: 70
tags: [concurrency,csharp]
story_beat: "Sécuriser la capacité Producteur / consommateur avec Channel d'Asteria."
deliverables: [Channel.cs]
starter: [Channel.cs]
grading:
  - type: io
    cases:
      - stdin: "3\n2\n3\n4\n"
        expect_stdout: "4\n6\n8\n"
        expect_exit: 0
      - stdin: "1\n5\n"
        expect_stdout: "10\n"
        expect_exit: 0
      - stdin: "2\n1\n10\n"
        expect_stdout: "2\n20\n"
        expect_exit: 0
      # cas discriminants anti-hardcode
      - stdin: "4\n10\n20\n30\n40\n"
        expect_stdout: "20\n40\n60\n80\n"
        expect_exit: 0
      - stdin: "2\n0\n7\n"
        expect_stdout: "0\n14\n"
        expect_exit: 0
      - stdin: "1\n99\n"
        expect_stdout: "198\n"
        expect_exit: 0
  - type: source
    source:
      require_compilation: true
      required_syntax: ["await-foreach"]
      required_invocations: ["System.Threading.Channels.Channel.CreateUnbounded"]
feedback:
  hints:
    - when: io_mismatch
      message: "Crée un Channel<int>, écris les N entiers de façon asynchrone, appelle Writer.Complete(), puis parcours Reader.ReadAllAsync() avec await foreach et affiche le double. Ajoute les namespaces Channels et Tasks."
    - when: source_constraint
      message: "La solution doit créer un vrai Channel et le consommer avec await foreach ; une boucle directe ne valide pas l'objectif."
  course_ref: "cours.md#channel"
solution: [Channel.cs]
