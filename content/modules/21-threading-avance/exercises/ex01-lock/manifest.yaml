id: ex01-lock
title: "Compteur protégé par lock"
objective: "Incrémenter un compteur partagé N fois depuis plusieurs threads en protégeant l'accès avec lock."
difficulty: moyen
estimated_minutes: 35
xp: 70
tags: [concurrency,csharp]
story_beat: "Sécuriser la capacité Compteur protégé par lock d'Asteria."
deliverables: [Lock.cs]
starter: [Lock.cs]
grading:
  - type: io
    cases:
      - stdin: "1000\n"
        expect_stdout: "1000\n"
        expect_exit: 0
      - stdin: "50\n"
        expect_stdout: "50\n"
        expect_exit: 0
      - stdin: "1\n"
        expect_stdout: "1\n"
        expect_exit: 0
      # cas discriminants anti-hardcode
      - stdin: "0\n"
        expect_stdout: "0\n"
        expect_exit: 0
      - stdin: "100\n"
        expect_stdout: "100\n"
        expect_exit: 0
      - stdin: "500\n"
        expect_stdout: "500\n"
        expect_exit: 0
  - type: source
    source:
      require_compilation: true
      required_syntax: ["lock"]
      required_invocations: ["System.Threading.Tasks.Parallel.For"]
feedback:
  hints:
    - when: io_mismatch
      message: "var verrou = new object(); int compteur = 0; Parallel.For(0, n, _ => { lock (verrou) { compteur++; } }); puis affiche compteur. N'oublie pas using System.Threading.Tasks;."
    - when: source_constraint
      message: "Le compteur doit être réellement partagé et incrémenté dans un Parallel.For protégé par une instruction lock."
  course_ref: "cours.md#lock"
solution: [Lock.cs]
