id: ex04-expr
title: "Arbre d'expression (union récursive)"
objective: "Évaluer un arbre arithmétique modélisé par une union récursive via pattern matching."
difficulty: difficile
estimated_minutes: 90
xp: 180
tags: [csharp,modeling]
story_beat: "Sécuriser la capacité Arbre d'expression (union récursive) d'Asteria."
bonus: true
deliverables: [Expression.cs]
starter: [Expression.cs]
grading:
  - type: io
    cases:
      - stdin: "+ 3 * 4 2\n"
        expect_stdout: "11\n"
        expect_exit: 0
      - stdin: "* + 1 2 3\n"
        expect_stdout: "9\n"
        expect_exit: 0
      - stdin: "5\n"
        expect_stdout: "5\n"
        expect_exit: 0
      # anti-hardcode : + 1 2 => 3 (addition simple de deux feuilles)
      - stdin: "+ 1 2\n"
        expect_stdout: "3\n"
        expect_exit: 0
      # * 3 3 => 9 (multiplication de deux feuilles identiques)
      - stdin: "* 3 3\n"
        expect_stdout: "9\n"
        expect_exit: 0
      # + * 2 3 * 4 5 => 2*3 + 4*5 = 6+20 = 26 (expression profonde)
      - stdin: "+ * 2 3 * 4 5\n"
        expect_stdout: "26\n"
        expect_exit: 0
  - type: source
    source:
      required_fragments: ["abstract record Expr", "switch"]
feedback:
  hints:
      - when: io_mismatch
        message: "Union : Nombre(int) ou Operation(symbole, gauche, droite). Lis la notation préfixe récursivement : si le token est + ou *, lis deux sous-expressions ; sinon c'est un nombre. Évalue par un switch récursif. '+ 3 * 4 2' = 3 + (4*2) = 11."
      - when: compile_error
        message: "Déclare une base abstraite puis deux records dérivés ; Parser et Evaluer retournent le type de base pour accepter toutes les variantes."
  course_ref: "cours.md#recursive"
solution: [Expression.cs]
