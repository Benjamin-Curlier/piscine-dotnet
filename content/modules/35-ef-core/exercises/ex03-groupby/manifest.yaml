id: ex03-groupby
title: "Agrégation (GroupBy)"
objective: "Regrouper des entités par un champ et compter chaque groupe."
difficulty: moyen
estimated_minutes: 45
xp: 90
tags: [data,ef-core]
story_beat: "Sécuriser la capacité Agrégation (GroupBy) d'Asteria."
deliverables: [ComptageCategories.cs]
starter: [ComptageCategories.cs]
grading:
  - type: io
    cases:
      - stdin: "4\nfruit Pomme\nlegume Carotte\nfruit Poire\nlegume Chou\n"
        expect_stdout: "fruit: 2\nlegume: 2\n"
        expect_exit: 0
      - stdin: "3\nfruit Kiwi\nfruit Mangue\nlegume Chou\n"
        expect_stdout: "fruit: 2\nlegume: 1\n"
        expect_exit: 0
      # 3 catégories : tri alphabétique vérifié
      - stdin: "5\nviande Boeuf\nfruit Cerise\nlegume Navet\nviande Porc\nfruit Abricot\n"
        expect_stdout: "fruit: 2\nlegume: 1\nviande: 2\n"
        expect_exit: 0
      # 1 seule catégorie
      - stdin: "3\nbio Carotte\nbio Courgette\nbio Tomate\n"
        expect_stdout: "bio: 3\n"
        expect_exit: 0
  - type: source
    source:
      required_fragments: ["DbContext", ".GroupBy("]
feedback:
  hints:
    - when: io_mismatch
      message: "Vérifie séparément les quatre étapes : les entités sont-elles enregistrées, les catégories forment-elles les clés des groupes, la projection contient-elle clé et Count(), puis le résultat est-il trié avant affichage ?"
    - when: source_constraint
      message: "Le comptage doit être produit par une vraie requête EF Core GroupBy, pas par un dictionnaire calculé à côté du DbContext."
  course_ref: "cours.md#agregation"
solution: [ComptageCategories.cs]
