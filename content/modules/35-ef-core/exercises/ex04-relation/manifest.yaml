id: ex04-relation
title: "Relation 1-N & Include"
objective: "Modéliser une relation un-à-plusieurs et charger les entités liées (Include)."
difficulty: difficile
estimated_minutes: 90
xp: 180
tags: [data,ef-core]
story_beat: "Sécuriser la capacité Relation 1-N & Include d'Asteria."
bonus: true
deliverables: [Bibliotheque.cs]
starter: [Bibliotheque.cs]
grading:
  - type: io
    cases:
      - stdin: "3\nHugo Miserables\nHugo Notre-Dame\nZola Germinal\n"
        expect_stdout: "Hugo: Miserables, Notre-Dame\nZola: Germinal\n"
        expect_exit: 0
      - stdin: "2\nVerne Voyage\nVerne Ile\n"
        expect_stdout: "Verne: Ile, Voyage\n"
        expect_exit: 0
      # 3 auteurs différents, chacun 1 livre : tri auteurs
      - stdin: "3\nZola Nana\nBalzac Eugenie\nFlaubert Bovary\n"
        expect_stdout: "Balzac: Eugenie\nFlaubert: Bovary\nZola: Nana\n"
        expect_exit: 0
      # 1 auteur, 3 livres : titres triés
      - stdin: "3\nDumas Monte-Cristo\nDumas Mousquetaires\nDumas Tulipe\n"
        expect_stdout: "Dumas: Monte-Cristo, Mousquetaires, Tulipe\n"
        expect_exit: 0
  - type: source
    source:
      required_fragments: ["DbContext", ".Include("]
feedback:
  hints:
      - when: io_mismatch
        message: "Auteur a une List<Livre> ; Livre a AuteurId + Auteur. Réutilise l'auteur déjà créé (dictionnaire). Charge avec db.Auteurs.Include(a => a.Livres).OrderBy(a => a.Nom) et trie aussi les titres. Affiche 'auteur: titre1, titre2'."
      - when: compile_error
        message: "Les navigations sont réciproques : Auteur expose une collection de Livre, et Livre une clé AuteurId ainsi qu'une propriété Auteur initialisée."
  course_ref: "cours.md#relations"
solution: [Bibliotheque.cs]
