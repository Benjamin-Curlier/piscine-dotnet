id: ex00-assertion
title: "Premier vrai test xUnit"
objective: "Écrire des tests xUnit avec Fact et Assert.Equal contre une API fournie."
difficulty: facile
estimated_minutes: 25
xp: 50
tags: [testing, quality]
story_beat: "Installer le premier filet de sécurité automatisé d'Asteria."
deliverables: [CalculatriceTests.cs]
starter: [CalculatriceTests.cs]
grading:
  - type: mutation
    reference: reference/Calculatrice.cs
    mutants:
      - id: mauvaise-operation
        label: "Les tests ne distinguent pas une addition d'une soustraction."
        find: "a + b"
        replace: "a - b"
feedback:
  hints:
    - when: mutant_survived
      message: "Le cas 0 + 0 passe pour trop d'implémentations. Choisis des valeurs qui distinguent clairement + de -."
    - when: tests_fail_on_reference
      message: "Arrange les valeurs, appelle Calculatrice.Additionner, puis compare le résultat attendu avec Assert.Equal."
  course_ref: "cours.md#premier-test-xunit"
solution: [CalculatriceTests.cs]
