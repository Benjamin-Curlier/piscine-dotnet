id: ex02-cas-limites
title: "Tester résultat et exception"
objective: "Vérifier un chemin nominal avec Assert.Equal et un contrat d'erreur avec Assert.Throws."
difficulty: moyen
estimated_minutes: 40
xp: 80
tags: [testing, exceptions]
story_beat: "Empêcher une division invalide de couper les calculateurs d'Asteria."
deliverables: [DivisionTests.cs]
starter: [DivisionTests.cs]
grading:
  - type: mutation
    reference: reference/Division.cs
    mutants:
      - id: mauvaise-operation
        label: "Le calcul nominal n'est pas suffisamment vérifié."
        find: "a / b"
        replace: "a * b"
      - id: zero-accepte
        label: "Le diviseur nul doit lever ArgumentException."
        find: "b == 0"
        replace: "b < 0"
feedback:
  hints:
    - when: mutant_survived
      message: "Il faut deux intentions distinctes : un quotient vérifié et Assert.Throws<ArgumentException> pour b = 0."
    - when: tests_fail_on_reference
      message: "N'exécute pas toi-même le try/catch : xUnit capture l'exception avec Assert.Throws."
  course_ref: "cours.md#tester-les-exceptions"
solution: [DivisionTests.cs]
