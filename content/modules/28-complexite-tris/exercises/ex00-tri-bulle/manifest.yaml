id: ex00-tri-bulle
title: "Tri à bulles"
objective: "Faire remonter les plus grandes valeurs par passes successives et mesurer le coût quadratique du tri à bulles."
difficulty: facile
estimated_minutes: 20
xp: 40
tags: [algorithms,performance]
story_beat: "Sécuriser la capacité Tri à bulles d'Asteria."
deliverables: [TriBulle.cs]
starter: [TriBulle.cs]
grading:
  - type: io
    cases:
      - stdin: "5 3 1 4 2\n"
        expect_stdout: "1 2 3 4 5\n"
        expect_exit: 0
      - stdin: "3 2 1\n"
        expect_stdout: "1 2 3\n"
        expect_exit: 0
      - stdin: "7\n"
        expect_stdout: "7\n"
        expect_exit: 0
      # déjà trié : ne doit rien casser
      - stdin: "1 2 3 4\n"
        expect_stdout: "1 2 3 4\n"
        expect_exit: 0
      # ordre inversé (pire cas)
      - stdin: "5 4 3 2 1\n"
        expect_stdout: "1 2 3 4 5\n"
        expect_exit: 0
      # doublons + tableau plus grand (anti-hardcode)
      - stdin: "5 3 8 3 1 9 2 7\n"
        expect_stdout: "1 2 3 3 5 7 8 9\n"
        expect_exit: 0
      # valeurs négatives et mixtes
      - stdin: "-3 0 -1 2\n"
        expect_stdout: "-3 -1 0 2\n"
        expect_exit: 0
  - type: source
    source:
      forbidden_fragments: ["Array.Sort", ".Sort(", ".OrderBy"]
feedback:
  hints:
    - when: io_mismatch
      message: "Deux boucles imbriquées : pour i de 0 à t.Length-2, pour j de 0 à t.Length-2-i ; si t[j] > t[j+1], échange les deux. N'utilise pas Array.Sort."
    - when: source_constraint
      message: "Le but est d'implémenter les passes du tri à bulles : n'utilise pas Array.Sort, List.Sort ni OrderBy."
  course_ref: "cours.md#tri-bulle"
solution: [TriBulle.cs]
