id: ex00-singleton
title: "Singleton — instance unique partagée"
objective: "Garantir qu'une classe n'a qu'une seule instance, accessible globalement."
difficulty: facile
estimated_minutes: 20
xp: 40
tags: [patterns,architecture]
story_beat: "Sécuriser la capacité Singleton — instance unique partagée d'Asteria."
deliverables: [Compteur.cs]
starter: [Compteur.cs]
grading:
  - type: io
    cases:
      - stdin: "3\n5\n"
        expect_stdout: "8\n"
        expect_exit: 0
      - stdin: "0\n0\n"
        expect_stdout: "0\n"
        expect_exit: 0
      - stdin: "10\n1\n"
        expect_stdout: "11\n"
        expect_exit: 0
      # a grand, b=0 : total = a seulement
      - stdin: "7\n0\n"
        expect_stdout: "7\n"
        expect_exit: 0
      # a=0, b grand : piège si deux instances distinctes
      - stdin: "0\n9\n"
        expect_stdout: "9\n"
        expect_exit: 0
      # a=b : total = 2*a
      - stdin: "4\n4\n"
        expect_stdout: "8\n"
        expect_exit: 0
  - type: source
    source:
      required_fragments: ["private Compteur", "static Compteur"]
feedback:
  hints:
    - when: io_mismatch
      message: "Constructeur privé + propriété statique Instance qui crée l'objet au premier accès (??=). Les deux boucles incrémentent la MÊME instance, donc le total est a + b."
  course_ref: "cours.md#singleton"
solution: [Compteur.cs]
