id: ex03-top-k
title: "Top K des mots fréquents"
objective: "Afficher les K mots les plus fréquents d'une ligne, triés par fréquence décroissante puis ordre alphabétique."
difficulty: difficile
estimated_minutes: 60
xp: 120
tags: [csharp,data]
story_beat: "Sécuriser la capacité Top K des mots fréquents d'Asteria."
bonus: true
deliverables: [TopK.cs]
starter: [TopK.cs]
grading:
  - type: io
    cases:
      - stdin: "a b a c a b\n2\n"
        expect_stdout: "a\nb\n"
        expect_exit: 0
      - stdin: "chat chien chat oiseau chien chat\n1\n"
        expect_stdout: "chat\n"
        expect_exit: 0
      # ex-aequo départagés par ordre alphabétique
      - stdin: "banane pomme cerise\n3\n"
        expect_stdout: "banane\ncerise\npomme\n"
        expect_exit: 0
      # K plus grand que le nombre de mots distincts
      - stdin: "x y x\n5\n"
        expect_stdout: "x\ny\n"
        expect_exit: 0
      # un seul mot répété
      - stdin: "lo lo lo lo\n1\n"
        expect_stdout: "lo\n"
        expect_exit: 0
      # ex-aequo partiel : 'a'(3) > 'b'(2)=='c'(2), K=2 garde a puis b
      - stdin: "a a a b b c c\n2\n"
        expect_stdout: "a\nb\n"
        expect_exit: 0
feedback:
  hints:
      - when: io_mismatch
        message: "Compte chaque mot dans un Dictionary<string,int>, trie les paires par fréquence décroissante puis par mot croissant, et ne conserve que K résultats. Le second critère rend les égalités déterministes."
      - when: compile_error
        message: "Un Dictionary<string,int> stocke les comptes ; les opérateurs de tri et Take viennent de System.Linq."
  course_ref: "cours.md#top-k"
solution: [TopK.cs]
